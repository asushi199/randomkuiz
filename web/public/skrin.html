<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skrin Rebutan — Kuiz Ilmuan Cilik</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #0b1f33; color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column;
      }
      .gate {
        margin: auto; text-align: center; padding: 2rem;
      }
      .gate input {
        padding: 0.7rem 1rem; font-size: 1.1rem; border-radius: 8px; border: none; width: 260px;
      }
      .gate button {
        margin-top: 1rem; padding: 0.7rem 1.6rem; font-size: 1.1rem; border: none;
        border-radius: 8px; background: #1e88e5; color: #fff; cursor: pointer;
      }
      .gate .err { color: #ff8a80; margin-top: 0.75rem; min-height: 1.2em; }

      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 1rem 1.5rem; background: rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.12);
      }
      .topbar .tajuk { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.02em; }
      .topbar .prog { font-size: 1.15rem; font-weight: 700; color: #90caf9; }

      .stage {
        flex: 1; display: flex; flex-direction: column; justify-content: center;
        padding: 3vh 5vw; gap: 3vh;
      }
      .topik-badge {
        align-self: flex-start; padding: 0.3rem 1rem; border-radius: 999px;
        background: rgba(144,202,249,0.2); border: 1px solid rgba(144,202,249,0.5);
        font-size: 1.3rem; font-weight: 600;
      }
      .soalan { font-size: clamp(1.8rem, 4vw, 3.2rem); font-weight: 700; line-height: 1.35; }
      .opsyen { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vh 2vw; }
      .opt {
        display: flex; align-items: center; gap: 1rem; padding: 1.4vh 1.5vw;
        background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
        border-radius: 14px; font-size: clamp(1.3rem, 2.4vw, 2rem);
      }
      .opt .huruf {
        display: inline-flex; align-items: center; justify-content: center;
        width: 2.4rem; height: 2.4rem; border-radius: 8px; background: #1e88e5;
        font-weight: 800; flex-shrink: 0;
      }
      .opt.betul { background: rgba(67,160,71,0.35); border-color: #66bb6a; }
      .opt.betul .huruf { background: #43a047; }

      .kawalan {
        display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
        padding: 0.85rem 1.5rem; background: rgba(0,0,0,0.35); border-top: 1px solid rgba(255,255,255,0.12);
      }
      .kawalan button {
        padding: 0.6rem 1.1rem; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer;
        background: #37474f; color: #fff;
      }
      .kawalan button.primary { background: #1e88e5; }
      .kawalan button.reveal { background: #43a047; }
      .kawalan .sep { flex: 1; }
      .kawalan .mata-input { width: 64px; padding: 0.5rem; border-radius: 6px; border: none; font-size: 1rem; }
      .team-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .team-btns button { background: #5e35b1; }
      .team-btns button:hover { background: #4527a0; }
      .toast {
        position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.85); padding: 0.6rem 1.2rem; border-radius: 8px;
        font-size: 1rem; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      .toast.show { opacity: 1; }
      @media (max-width: 700px) { .opsyen { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <!-- Gate PIN -->
    <div id="gate" class="gate">
      <h2>Skrin Rebutan (S3P2)</h2>
      <p>Masukkan PIN pentadbir untuk memuatkan soalan.</p>
      <input type="password" id="pin" placeholder="PIN pentadbir" />
      <br />
      <button id="btn-masuk">Muat Soalan</button>
      <div class="err" id="err"></div>
    </div>

    <!-- Skrin utama -->
    <div id="main" style="display:none; flex:1; flex-direction:column;">
      <div class="topbar">
        <span class="tajuk">Saringan 3 — Pusingan 2 · Rebutan</span>
        <span class="prog" id="prog"></span>
      </div>
      <div class="stage">
        <span class="topik-badge" id="topik"></span>
        <div class="soalan" id="soalan"></div>
        <div class="opsyen" id="opsyen"></div>
      </div>
      <div class="kawalan">
        <button id="btn-prev">◀ Sebelum</button>
        <button id="btn-reveal" class="reveal">Papar Jawapan</button>
        <button id="btn-next" class="primary">Seterusnya ▶</button>
        <span class="sep"></span>
        <span>Mata betul:</span>
        <input type="number" id="mata" class="mata-input" value="5" min="1" />
        <div class="team-btns" id="team-btns"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="js/config.js?v=1" onerror="this.remove()"></script>
    <script src="js/config.example.js?v=10"></script>
    <script>
      (function () {
        "use strict";
        var API = ((window.EXAM_CONFIG || {}).API_URL || "").trim();
        var pin = "", soalan = [], idx = 0, revealed = false, teams = [];
        var daerahNama = {};
        var $ = function (id) { return document.getElementById(id); };

        async function api(action, payload) {
          var body = JSON.stringify(Object.assign({ action: action }, payload || {}));
          var res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body });
          return JSON.parse(await res.text());
        }
        function toast(msg) {
          var t = $("toast"); t.textContent = msg; t.classList.add("show");
          setTimeout(function () { t.classList.remove("show"); }, 1600);
        }

        async function masuk() {
          var v = $("pin").value.trim();
          if (!v) return;
          $("err").textContent = "Memuatkan…";
          try {
            var init = await api("getInit", {});
            (init.daerah || []).forEach(function (d) { daerahNama[d.kod] = d.nama; });
            var data = await api("adminRebutanSoalan", { pin: v });
            if (!data.ok) { $("err").textContent = data.ralat || "PIN tidak sah."; return; }
            pin = v;
            soalan = data.soalan || [];
            teams = (data.daerah_layak && data.daerah_layak.length) ? data.daerah_layak : [];
            if (!soalan.length) { $("err").textContent = "Tiada soalan rebutan."; return; }
            $("gate").style.display = "none";
            $("main").style.display = "flex";
            renderTeams();
            idx = 0; render();
          } catch (e) { $("err").textContent = "Ralat sambungan."; }
        }

        function renderTeams() {
          var wrap = $("team-btns"); wrap.innerHTML = "";
          if (!teams.length) {
            var note = document.createElement("span");
            note.style.color = "#ffcc80";
            note.style.fontSize = "0.95rem";
            note.textContent = "Belum ada pasukan layak S3P1. Sila 'Auto-kunci' di panel pentadbir dahulu.";
            wrap.appendChild(note);
            return;
          }
          teams.forEach(function (kod) {
            var b = document.createElement("button");
            b.textContent = (daerahNama[kod] || kod) + " ✔";
            b.title = "Rekod jawapan BETUL untuk " + (daerahNama[kod] || kod);
            b.addEventListener("click", function () { score(kod); });
            wrap.appendChild(b);
          });
        }

        function render() {
          revealed = false;
          var q = soalan[idx];
          $("prog").textContent = "Soalan " + (idx + 1) + " / " + soalan.length;
          $("topik").textContent = q.topik || "";
          $("soalan").textContent = q.soalan;
          var wrap = $("opsyen"); wrap.innerHTML = "";
          ["A", "B", "C", "D"].forEach(function (l) {
            var div = document.createElement("div");
            div.className = "opt"; div.dataset.huruf = l;
            div.innerHTML = '<span class="huruf">' + l + "</span><span>" + esc(q[l] || "") + "</span>";
            wrap.appendChild(div);
          });
        }
        function reveal() {
          if (revealed) return;
          revealed = true;
          var q = soalan[idx];
          Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (el) {
            if (el.dataset.huruf === q.jawapan) el.classList.add("betul");
          });
        }
        async function score(kod) {
          var q = soalan[idx];
          var mata = Number($("mata").value || 5);
          try {
            await api("adminRebutanScore", { pin: pin, no_soalan: q.no, daerah: kod, betul: true, mata: mata });
            toast((daerahNama[kod] || kod) + " +" + mata + " mata");
          } catch (e) { toast("Gagal merekod"); }
        }
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }

        $("btn-masuk").addEventListener("click", masuk);
        $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") masuk(); });
        $("btn-prev").addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
        $("btn-next").addEventListener("click", function () { if (idx < soalan.length - 1) { idx++; render(); } });
        $("btn-reveal").addEventListener("click", reveal);
        document.addEventListener("keydown", function (e) {
          if ($("main").style.display === "none") return;
          if (e.key === "ArrowRight") { if (idx < soalan.length - 1) { idx++; render(); } }
          if (e.key === "ArrowLeft") { if (idx > 0) { idx--; render(); } }
          if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); }
        });
      })();
    </script>
  </body>
</html>
