<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skrin Rebutan — Kuiz Ilmuan Cilik</title>
    <style>
      :root {
        --cream: #f7f3e8; --white: #ffffff; --ink: #123a2e;
        --green: #0e6b4f; --green-d: #0a5540; --green-l: #e6f1ea;
        --gold: #c79a3b; --gold-d: #a67d24; --line: #e6dfcc; --muted: #5f7168;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--cream); color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column;
      }
      /* Gate */
      .gate { margin: auto; text-align: center; padding: 2rem; }
      .gate h2 { color: var(--green); font-size: 2rem; margin: 0 0 .5rem; }
      .gate input { padding: .75rem 1rem; font-size: 1.1rem; border-radius: 10px; border: 2px solid var(--line); width: 280px; }
      .gate button { margin-top: 1rem; padding: .75rem 1.8rem; font-size: 1.1rem; border: none; border-radius: 10px; background: var(--green); color: #fff; cursor: pointer; font-weight: 600; }
      .gate .err { color: #b3402f; margin-top: .75rem; min-height: 1.2em; }

      /* Top bar */
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 1rem 1.6rem; background: linear-gradient(100deg, var(--green), var(--green-d)); color: #fff;
      }
      .topbar .tajuk { font-size: 1.2rem; font-weight: 700; letter-spacing: .01em; }
      .topbar .prog { font-size: 1.2rem; font-weight: 800; color: #ffe6a6; }

      /* Stage */
      .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 3vh 5vw; gap: 2.6vh; }
      .topik-badge {
        align-self: flex-start; padding: .35rem 1.1rem; border-radius: 999px;
        background: var(--green-l); border: 1px solid var(--green); color: var(--green-d);
        font-size: 1.25rem; font-weight: 700; letter-spacing: .03em;
      }
      .soalan { font-size: clamp(1.9rem, 4vw, 3.3rem); font-weight: 800; line-height: 1.32; color: var(--ink); }
      .opsyen { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh 2vw; }
      .opt {
        display: flex; align-items: center; gap: 1rem; padding: 1.5vh 1.5vw;
        background: var(--white); border: 2px solid var(--line); border-radius: 16px;
        font-size: clamp(1.3rem, 2.4vw, 2rem); box-shadow: 0 2px 8px rgba(18,58,46,.06);
      }
      .opt .huruf {
        display: inline-flex; align-items: center; justify-content: center;
        width: 2.5rem; height: 2.5rem; border-radius: 10px; background: var(--green); color: #fff;
        font-weight: 800; flex-shrink: 0;
      }
      .opt.betul { background: var(--green-l); border-color: var(--green); }
      .opt.betul .huruf { background: var(--gold); color: #3a2c05; }

      /* Papan skor */
      .skor-strip {
        display: flex; gap: 1rem; padding: .9rem 1.6rem; background: #efe8d5;
        border-top: 1px solid var(--line); overflow-x: auto;
      }
      .skor-card {
        flex: 1 1 0; min-width: 150px; background: var(--white); border: 2px solid var(--line);
        border-radius: 14px; padding: .6rem 1rem; text-align: center;
      }
      .skor-card.lead { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(199,154,59,.25); }
      .skor-nama { font-size: .95rem; font-weight: 700; color: var(--green-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .skor-mata { font-size: 2.1rem; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
      .skor-mata small { font-size: .9rem; color: var(--muted); font-weight: 600; }

      /* Kawalan */
      .kawalan {
        display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
        padding: .85rem 1.6rem; background: var(--white); border-top: 1px solid var(--line);
      }
      .kawalan button { padding: .6rem 1.1rem; font-size: 1rem; border: none; border-radius: 9px; cursor: pointer; background: #e7ecea; color: var(--ink); font-weight: 600; }
      .kawalan button.primary { background: var(--green); color: #fff; }
      .kawalan button.reveal { background: var(--gold); color: #3a2c05; }
      .kawalan .sep { flex: 1; }
      .kawalan .mata-input { width: 64px; padding: .5rem; border-radius: 8px; border: 2px solid var(--line); font-size: 1rem; }
      .team-btns { display: flex; gap: .6rem; flex-wrap: wrap; }
      .team-btns button {
        display: inline-flex; align-items: center; gap: .5rem;
        background: var(--white); color: var(--green-d); border: 2px solid var(--green);
        padding: .5rem .95rem; border-radius: 999px; font-weight: 700; font-size: 1.02rem;
        box-shadow: 0 2px 7px rgba(14,107,79,.16); transition: transform .08s, background .14s, color .14s;
      }
      .team-btns button:hover { background: var(--green); color: #fff; transform: translateY(-2px); box-shadow: 0 5px 14px rgba(14,107,79,.28); }
      .team-btns button:active { transform: scale(.96); }
      .team-btns button .tk {
        display: inline-flex; align-items: center; justify-content: center;
        width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--green); color: #fff;
        font-size: .85rem; flex: none;
      }
      .team-btns button:hover .tk { background: #fff; color: var(--green); }
      .team-note { color: #9a5b12; font-size: .95rem; }

      .toast {
        position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
        background: var(--green-d); color: #fff; padding: .7rem 1.4rem; border-radius: 10px;
        font-size: 1.05rem; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none;
      }
      .toast.show { opacity: 1; }
      @media (max-width: 700px) { .opsyen { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="gate" class="gate">
      <h2>Skrin Rebutan</h2>
      <p>Masukkan PIN pentadbir untuk memuatkan soalan.</p>
      <input type="password" id="pin" placeholder="PIN pentadbir" />
      <br />
      <button id="btn-masuk">Muat Soalan</button>
      <div class="err" id="err"></div>
    </div>

    <div id="main" style="display:none; flex:1; flex-direction:column;">
      <div class="topbar">
        <span class="tajuk">Saringan 3 — Pusingan 2 · Rebutan</span>
        <span class="prog" id="prog"></span>
      </div>
      <div class="stage">
        <span class="topik-badge" id="topik"></span>
        <div class="soalan" id="soalan"></div>
        <div class="opsyen" id="opsyen"></div>
      </div>
      <div class="skor-strip" id="skor-strip"></div>
      <div class="kawalan">
        <button id="btn-prev">◀ Sebelum</button>
        <button id="btn-reveal" class="reveal">Papar Jawapan</button>
        <button id="btn-next" class="primary">Seterusnya ▶</button>
        <span class="sep"></span>
        <span>Mata betul:</span>
        <input type="number" id="mata" class="mata-input" value="5" min="1" />
        <div class="team-btns" id="team-btns"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="js/config.js?v=1" onerror="this.remove()"></script>
    <script src="js/config.example.js?v=10"></script>
    <script>
      (function () {
        "use strict";
        var API = ((window.EXAM_CONFIG || {}).API_URL || "").trim();
        var pin = "", soalan = [], idx = 0, revealed = false, teams = [];
        var daerahNama = {};
        var $ = function (id) { return document.getElementById(id); };

        async function api(action, payload) {
          var body = JSON.stringify(Object.assign({ action: action }, payload || {}));
          var res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: body });
          return JSON.parse(await res.text());
        }
        function toast(msg) {
          var t = $("toast"); t.textContent = msg; t.classList.add("show");
          setTimeout(function () { t.classList.remove("show"); }, 1600);
        }
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }

        async function masuk() {
          var v = $("pin").value.trim();
          if (!v) return;
          $("err").textContent = "Memuatkan…";
          try {
            var init = await api("getInit", {});
            (init.daerah || []).forEach(function (d) { daerahNama[d.kod] = d.nama; });
            var data = await api("adminRebutanSoalan", { pin: v });
            if (!data.ok) { $("err").textContent = data.ralat || "PIN tidak sah."; return; }
            pin = v;
            soalan = data.soalan || [];
            teams = (data.daerah_layak && data.daerah_layak.length) ? data.daerah_layak : [];
            if (!soalan.length) { $("err").textContent = "Tiada soalan rebutan."; return; }
            $("gate").style.display = "none";
            $("main").style.display = "flex";
            renderTeams();
            idx = 0; render();
            loadScores();
            setInterval(loadScores, 5000); // segar papan skor
          } catch (e) { $("err").textContent = "Ralat sambungan."; }
        }

        function renderTeams() {
          var wrap = $("team-btns"); wrap.innerHTML = "";
          if (!teams.length) {
            var note = document.createElement("span");
            note.className = "team-note";
            note.textContent = "Belum ada pasukan layak S3P1. Sila 'Auto-kunci' di panel pentadbir dahulu.";
            wrap.appendChild(note);
            return;
          }
          teams.forEach(function (kod) {
            var b = document.createElement("button");
            b.innerHTML = '<span class="tk">✔</span>' + esc(daerahNama[kod] || kod);
            b.title = "Rekod jawapan BETUL untuk " + (daerahNama[kod] || kod);
            b.addEventListener("click", function () { score(kod); });
            wrap.appendChild(b);
          });
        }

        async function loadScores() {
          try {
            var d = await api("adminRebutanState", { pin: pin });
            if (d && d.ok) renderScores(d.pasukan || []);
          } catch (e) { /* biar */ }
        }
        function renderScores(list) {
          var strip = $("skor-strip");
          if (!list.length) { strip.style.display = "none"; return; }
          strip.style.display = "flex";
          var max = Math.max.apply(null, list.map(function (p) { return p.mata; }).concat([0]));
          strip.innerHTML = list.map(function (p) {
            var lead = p.mata > 0 && p.mata === max ? " lead" : "";
            return '<div class="skor-card' + lead + '"><div class="skor-nama">' + esc(p.nama_daerah) +
              '</div><div class="skor-mata">' + p.mata + ' <small>mata</small></div></div>';
          }).join("");
        }

        function render() {
          revealed = false;
          var q = soalan[idx];
          $("prog").textContent = "Soalan " + (idx + 1) + " / " + soalan.length;
          $("topik").textContent = q.topik || "";
          $("soalan").textContent = q.soalan;
          var wrap = $("opsyen"); wrap.innerHTML = "";
          ["A", "B", "C", "D"].forEach(function (l) {
            var div = document.createElement("div");
            div.className = "opt"; div.dataset.huruf = l;
            div.innerHTML = '<span class="huruf">' + l + "</span><span>" + esc(q[l] || "") + "</span>";
            wrap.appendChild(div);
          });
        }
        function reveal() {
          if (revealed) return;
          revealed = true;
          var q = soalan[idx];
          Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (el) {
            if (el.dataset.huruf === q.jawapan) el.classList.add("betul");
          });
        }
        async function score(kod) {
          var q = soalan[idx];
          var mata = Number($("mata").value || 5);
          try {
            await api("adminRebutanScore", { pin: pin, no_soalan: q.no, daerah: kod, betul: true, mata: mata });
            toast((daerahNama[kod] || kod) + " +" + mata + " mata");
            loadScores();
          } catch (e) { toast("Gagal merekod"); }
        }

        $("btn-masuk").addEventListener("click", masuk);
        $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") masuk(); });
        $("btn-prev").addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
        $("btn-next").addEventListener("click", function () { if (idx < soalan.length - 1) { idx++; render(); } });
        $("btn-reveal").addEventListener("click", reveal);
        document.addEventListener("keydown", function (e) {
          if ($("main").style.display === "none") return;
          if (e.key === "ArrowRight") { if (idx < soalan.length - 1) { idx++; render(); } }
          if (e.key === "ArrowLeft") { if (idx > 0) { idx--; render(); } }
          if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); }
        });
      })();
    </script>
  </body>
</html>
